<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting your Survival Station...</title>
<style>
  html,body{margin:0;height:100%;}
  body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(160deg,#1f3b30,#2c5446);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
  }
  .box{padding:30px;}
  .logo{font-size:90px;margin-bottom:10px;}
  h1{font-size:40px;margin:0 0 14px;font-weight:800;}
  p{font-size:22px;margin:6px 0;color:#e9f3ee;}
  .spin{
    margin:26px auto 0;width:64px;height:64px;border-radius:50%;
    border:8px solid rgba(255,255,255,.25);border-top-color:#ffd27a;
    animation:r 1s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">&#127957;</div>
    <h1>Starting your Survival Station&hellip;</h1>
    <p>Please wait a moment while everything wakes up.</p>
    <p>Your main screen will open by itself.</p>
    <div class="spin"></div>
  </div>
</body>
</html>
